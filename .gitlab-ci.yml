# CI: build the PasarGuard panel image and push it to this project's GitLab
# Container Registry so it can be pulled directly, e.g.:
#
#   docker pull registry.gitlab.com/itentis1/siriusvpn/develop/pasarguard/panel:latest
#
# Requires the project's Container Registry to be enabled. $CI_REGISTRY*,
# $CI_JOB_TOKEN are provided by GitLab.

stages:
  - build

variables:
  # Image repository under this project's registry -> .../pasarguard/panel
  IMAGE: "$CI_REGISTRY_IMAGE/panel"
  DOCKERFILE: "Dockerfile.ci"

build:image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    # Connect the docker client to the dind service over TLS.
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_BUILDKIT: "1"
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  before_script:
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -f "$DOCKERFILE" -t "$IMAGE:$CI_COMMIT_SHORT_SHA" -t "$IMAGE:latest" .
    - docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$IMAGE:latest"
